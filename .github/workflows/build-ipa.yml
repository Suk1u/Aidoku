name: Build IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Get Short SHA
        id: commitinfo
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Archive
        run: |
          xcodebuild -scheme "Aidoku" \
            -configuration Release \
            -archivePath build/Aidoku.xcarchive \
            -skipPackagePluginValidation \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Aidoku.xcarchive/Products/Applications/Aidoku.app Payload/
          zip -r "Aidoku-iOS_${{ steps.commitinfo.outputs.sha_short }}.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aidoku-iOS-${{ steps.commitinfo.outputs.sha_short }}.ipa
          path: Aidoku-iOS_${{ steps.commitinfo.outputs.sha_short }}.ipa
          if-no-files-found: error
